<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#134e4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#14b8a6" />
      <stop offset="100%" style="stop-color:#5eead4" />
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)" />
  <g opacity="0.06">
    <line x1="0" y1="60" x2="640" y2="60" stroke="#5eead4" stroke-width="1"/>
    <line x1="0" y1="120" x2="640" y2="120" stroke="#5eead4" stroke-width="1"/>
    <line x1="0" y1="180" x2="640" y2="180" stroke="#5eead4" stroke-width="1"/>
    <line x1="0" y1="240" x2="640" y2="240" stroke="#5eead4" stroke-width="1"/>
    <line x1="0" y1="300" x2="640" y2="300" stroke="#5eead4" stroke-width="1"/>
  </g>
  <!-- Shield icon -->
  <path d="M320,65 L365,85 L365,130 Q365,165 320,180 Q275,165 275,130 L275,85 Z" fill="none" stroke="#14b8a6" stroke-width="2.5" opacity="0.7"/>
  <!-- Check mark inside shield -->
  <polyline points="300,120 315,135 345,105" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <!-- Title -->
  <text x="320" y="230" font-family="sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">AI倫理・リスク管理</text>
  <text x="320" y="265" font-family="sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">AI Ethics &amp; Risk Management</text>
  <rect x="220" y="300" width="200" height="4" rx="2" fill="url(#accent)" opacity="0.8"/>
</svg>