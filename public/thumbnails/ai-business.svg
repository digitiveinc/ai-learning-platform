<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#312e81;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b" />
      <stop offset="100%" style="stop-color:#fbbf24" />
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)" />
  <g opacity="0.06">
    <line x1="0" y1="60" x2="640" y2="60" stroke="#fbbf24" stroke-width="1"/>
    <line x1="0" y1="120" x2="640" y2="120" stroke="#fbbf24" stroke-width="1"/>
    <line x1="0" y1="180" x2="640" y2="180" stroke="#fbbf24" stroke-width="1"/>
    <line x1="0" y1="240" x2="640" y2="240" stroke="#fbbf24" stroke-width="1"/>
    <line x1="0" y1="300" x2="640" y2="300" stroke="#fbbf24" stroke-width="1"/>
  </g>
  <!-- Chart/Business icon -->
  <rect x="260" y="130" width="24" height="40" rx="4" fill="#f59e0b" opacity="0.5"/>
  <rect x="292" y="110" width="24" height="60" rx="4" fill="#f59e0b" opacity="0.6"/>
  <rect x="324" y="90" width="24" height="80" rx="4" fill="#f59e0b" opacity="0.7"/>
  <rect x="356" y="70" width="24" height="100" rx="4" fill="#fbbf24" opacity="0.8"/>
  <!-- Trend line -->
  <polyline points="272,125 304,105 336,85 368,65" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
  <circle cx="368" cy="65" r="4" fill="white" opacity="0.8"/>
  <!-- Title -->
  <text x="320" y="225" font-family="sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">AIビジネス活用</text>
  <text x="320" y="260" font-family="sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">AI for Business</text>
  <rect x="220" y="300" width="200" height="4" rx="2" fill="url(#accent)" opacity="0.8"/>
</svg>