<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c2d12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316" />
      <stop offset="100%" style="stop-color:#fb923c" />
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)" />
  <g opacity="0.06">
    <line x1="0" y1="60" x2="640" y2="60" stroke="#fb923c" stroke-width="1"/>
    <line x1="0" y1="120" x2="640" y2="120" stroke="#fb923c" stroke-width="1"/>
    <line x1="0" y1="180" x2="640" y2="180" stroke="#fb923c" stroke-width="1"/>
    <line x1="0" y1="240" x2="640" y2="240" stroke="#fb923c" stroke-width="1"/>
    <line x1="0" y1="300" x2="640" y2="300" stroke="#fb923c" stroke-width="1"/>
  </g>
  <!-- DX transformation arrows -->
  <g transform="translate(320,115)">
    <rect x="-55" y="-25" width="40" height="50" rx="6" fill="none" stroke="#fb923c" stroke-width="2" opacity="0.5"/>
    <text x="-35" y="8" font-family="sans-serif" font-size="14" fill="#fb923c" text-anchor="middle" opacity="0.7">Old</text>
    <!-- Arrow -->
    <path d="M-8,0 L8,0 M4,-6 L10,0 L4,6" fill="none" stroke="#f97316" stroke-width="2.5" opacity="0.8"/>
    <!-- New digital box -->
    <rect x="15" y="-25" width="40" height="50" rx="6" fill="#f97316" opacity="0.3" stroke="#f97316" stroke-width="2"/>
    <text x="35" y="4" font-family="sans-serif" font-size="11" fill="#fb923c" text-anchor="middle" font-weight="bold">AI</text>
    <text x="35" y="16" font-family="sans-serif" font-size="8" fill="#fb923c" text-anchor="middle">DX</text>
  </g>
  <!-- Title -->
  <text x="320" y="225" font-family="sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">AI×DX推進</text>
  <text x="320" y="260" font-family="sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">AI-Driven Digital Transformation</text>
  <rect x="220" y="300" width="200" height="4" rx="2" fill="url(#accent)" opacity="0.8"/>
</svg>