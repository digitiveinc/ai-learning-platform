<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#164e63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4" />
      <stop offset="100%" style="stop-color:#22d3ee" />
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)" />
  <g opacity="0.06">
    <line x1="0" y1="60" x2="640" y2="60" stroke="#22d3ee" stroke-width="1"/>
    <line x1="0" y1="120" x2="640" y2="120" stroke="#22d3ee" stroke-width="1"/>
    <line x1="0" y1="180" x2="640" y2="180" stroke="#22d3ee" stroke-width="1"/>
    <line x1="0" y1="240" x2="640" y2="240" stroke="#22d3ee" stroke-width="1"/>
    <line x1="0" y1="300" x2="640" y2="300" stroke="#22d3ee" stroke-width="1"/>
  </g>
  <!-- Pie chart -->
  <circle cx="290" cy="115" r="35" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.5"/>
  <path d="M290,80 A35,35 0 0,1 320,135 L290,115 Z" fill="#06b6d4" opacity="0.4"/>
  <path d="M290,80 A35,35 0 0,0 260,135 L290,115 Z" fill="#22d3ee" opacity="0.3"/>
  <!-- Bar chart mini -->
  <rect x="340" y="100" width="10" height="50" rx="2" fill="#06b6d4" opacity="0.4"/>
  <rect x="355" y="85" width="10" height="65" rx="2" fill="#22d3ee" opacity="0.5"/>
  <rect x="370" y="110" width="10" height="40" rx="2" fill="#06b6d4" opacity="0.4"/>
  <!-- Title -->
  <text x="320" y="225" font-family="sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">AIデータ分析</text>
  <text x="320" y="260" font-family="sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">AI-Powered Data Analysis</text>
  <rect x="220" y="300" width="200" height="4" rx="2" fill="url(#accent)" opacity="0.8"/>
