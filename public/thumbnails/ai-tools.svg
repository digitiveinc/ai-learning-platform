<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6" />
      <stop offset="100%" style="stop-color:#60a5fa" />
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)" />
  <g opacity="0.06">
    <line x1="0" y1="60" x2="640" y2="60" stroke="#60a5fa" stroke-width="1"/>
    <line x1="0" y1="120" x2="640" y2="120" stroke="#60a5fa" stroke-width="1"/>
    <line x1="0" y1="180" x2="640" y2="180" stroke="#60a5fa" stroke-width="1"/>
    <line x1="0" y1="240" x2="640" y2="240" stroke="#60a5fa" stroke-width="1"/>
    <line x1="0" y1="300" x2="640" y2="300" stroke="#60a5fa" stroke-width="1"/>
  </g>
  <!-- Tool icons (gear + wrench) -->
  <circle cx="310" cy="110" r="30" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.7"/>
  <circle cx="310" cy="110" r="12" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.7"/>
  <!-- Gear teeth -->
  <g stroke="#3b82f6" stroke-width="5" opacity="0.5" stroke-linecap="round">
    <line x1="310" y1="76" x2="310" y2="84"/>
    <line x1="310" y1="136" x2="310" y2="144"/>
    <line x1="276" y1="110" x2="284" y2="110"/>
    <line x1="336" y1="110" x2="344" y2="110"/>
    <line x1="286" y1="86" x2="292" y2="92"/>
    <line x1="328" y1="128" x2="334" y2="134"/>
    <line x1="334" y1="86" x2="328" y2="92"/>
    <line x1="292" y1="128" x2="286" y2="134"/>
  </g>
  <!-- Wrench -->
  <g transform="translate(345,125) rotate(45)" opacity="0.6">
    <rect x="-3" y="0" width="6" height="30" rx="3" fill="#60a5fa"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#60a5fa" stroke-width="3"/>
  </g>
  <!-- Title -->
  <text x="320" y="225" font-family="sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">AIツール実践</text>
  <text x="320" y="260" font-family="sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Hands-on AI Tools</text>
  <rect x="220" y="300" width="200" height="4" rx="2" fill="url(#accent)" opacity="0.8"/>
</svg>