<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1" />
      <stop offset="100%" style="stop-color:#818cf8" />
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)" />
  <!-- Grid pattern -->
  <g opacity="0.08">
    <line x1="0" y1="60" x2="640" y2="60" stroke="#818cf8" stroke-width="1"/>
    <line x1="0" y1="120" x2="640" y2="120" stroke="#818cf8" stroke-width="1"/>
    <line x1="0" y1="180" x2="640" y2="180" stroke="#818cf8" stroke-width="1"/>
    <line x1="0" y1="240" x2="640" y2="240" stroke="#818cf8" stroke-width="1"/>
    <line x1="0" y1="300" x2="640" y2="300" stroke="#818cf8" stroke-width="1"/>
    <line x1="106" y1="0" x2="106" y2="360" stroke="#818cf8" stroke-width="1"/>
    <line x1="213" y1="0" x2="213" y2="360" stroke="#818cf8" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="360" stroke="#818cf8" stroke-width="1"/>
    <line x1="426" y1="0" x2="426" y2="360" stroke="#818cf8" stroke-width="1"/>
    <line x1="533" y1="0" x2="533" y2="360" stroke="#818cf8" stroke-width="1"/>
  </g>
  <!-- Brain/AI icon -->
  <circle cx="320" cy="130" r="50" fill="none" stroke="#6366f1" stroke-width="2.5" opacity="0.6"/>
  <circle cx="305" cy="120" r="8" fill="#818cf8" opacity="0.8"/>
  <circle cx="335" cy="120" r="8" fill="#818cf8" opacity="0.8"/>
  <circle cx="320" cy="145" r="6" fill="#818cf8" opacity="0.8"/>
  <circle cx="295" cy="140" r="5" fill="#818cf8" opacity="0.6"/>
  <circle cx="345" cy="140" r="5" fill="#818cf8" opacity="0.6"/>
  <line x1="305" y1="120" x2="335" y2="120" stroke="#818cf8" stroke-width="1.5" opacity="0.5"/>
  <line x1="305" y1="120" x2="320" y2="145" stroke="#818cf8" stroke-width="1.5" opacity="0.5"/>
  <line x1="335" y1="120" x2="320" y2="145" stroke="#818cf8" stroke-width="1.5" opacity="0.5"/>
  <line x1="295" y1="140" x2="305" y2="120" stroke="#818cf8" stroke-width="1.5" opacity="0.4"/>
  <line x1="345" y1="140" x2="335" y2="120" stroke="#818cf8" stroke-width="1.5" opacity="0.4"/>
  <!-- Title -->
  <text x="320" y="230" font-family="sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">AI基礎研修</text>
  <text x="320" y="265" font-family="sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">AI Fundamentals Training</text>
  <!-- Bottom accent bar -->
  <rect x="220" y="300" width="200" height="4" rx="2" fill="url(#accent)" opacity="0.8"/>
</svg>