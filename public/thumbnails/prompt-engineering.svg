<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2744;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0c1524;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6" />
      <stop offset="100%" style="stop-color:#a78bfa" />
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)" />
  <g opacity="0.06">
    <line x1="0" y1="60" x2="640" y2="60" stroke="#a78bfa" stroke-width="1"/>
    <line x1="0" y1="120" x2="640" y2="120" stroke="#a78bfa" stroke-width="1"/>
    <line x1="0" y1="180" x2="640" y2="180" stroke="#a78bfa" stroke-width="1"/>
    <line x1="0" y1="240" x2="640" y2="240" stroke="#a78bfa" stroke-width="1"/>
    <line x1="0" y1="300" x2="640" y2="300" stroke="#a78bfa" stroke-width="1"/>
  </g>
  <!-- Chat bubble / prompt icon -->
  <rect x="240" y="70" width="160" height="90" rx="12" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.7"/>
  <polygon points="290,160 310,160 300,178" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.7"/>
  <!-- Cursor blinking -->
  <rect x="260" y="95" width="3" height="20" fill="#a78bfa" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  <!-- Text lines in bubble -->
  <rect x="272" y="98" width="100" height="6" rx="3" fill="#a78bfa" opacity="0.3"/>
  <rect x="272" y="112" width="80" height="6" rx="3" fill="#a78bfa" opacity="0.25"/>
  <rect x="272" y="126" width="60" height="6" rx="3" fill="#a78bfa" opacity="0.2"/>
  <!-- Title -->
  <text x="320" y="230" font-family="sans-serif" font-size="30" font-weight="bold" fill="white" text-anchor="middle">プロンプトエンジニアリング</text>
  <text x="320" y="265" font-family="sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Prompt Engineering</text>
  <rect x="220" y="300" width="200" height="4" rx="2" fill="url(#accent)" opacity="0.8"/>
</svg>