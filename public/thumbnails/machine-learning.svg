<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ec4899" />
      <stop offset="100%" style="stop-color:#f472b6" />
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)" />
  <g opacity="0.06">
    <line x1="0" y1="60" x2="640" y2="60" stroke="#f472b6" stroke-width="1"/>
    <line x1="0" y1="120" x2="640" y2="120" stroke="#f472b6" stroke-width="1"/>
    <line x1="0" y1="180" x2="640" y2="180" stroke="#f472b6" stroke-width="1"/>
    <line x1="0" y1="240" x2="640" y2="240" stroke="#f472b6" stroke-width="1"/>
    <line x1="0" y1="300" x2="640" y2="300" stroke="#f472b6" stroke-width="1"/>
  </g>
  <!-- Neural network -->
  <circle cx="270" cy="90" r="8" fill="#ec4899" opacity="0.7"/>
  <circle cx="270" cy="130" r="8" fill="#ec4899" opacity="0.7"/>
  <circle cx="270" cy="170" r="8" fill="#ec4899" opacity="0.7"/>
  <circle cx="320" cy="100" r="8" fill="#f472b6" opacity="0.8"/>
  <circle cx="320" cy="150" r="8" fill="#f472b6" opacity="0.8"/>
  <circle cx="370" cy="90" r="8" fill="#ec4899" opacity="0.7"/>
  <circle cx="370" cy="130" r="8" fill="#ec4899" opacity="0.7"/>
  <circle cx="370" cy="170" r="8" fill="#ec4899" opacity="0.7"/>
  <!-- Connections -->
  <g stroke="#f472b6" stroke-width="1" opacity="0.3">
    <line x1="278" y1="90" x2="312" y2="100"/><line x1="278" y1="90" x2="312" y2="150"/>
    <line x1="278" y1="130" x2="312" y2="100"/><line x1="278" y1="130" x2="312" y2="150"/>
    <line x1="278" y1="170" x2="312" y2="100"/><line x1="278" y1="170" x2="312" y2="150"/>
    <line x1="328" y1="100" x2="362" y2="90"/><line x1="328" y1="100" x2="362" y2="130"/><line x1="328" y1="100" x2="362" y2="170"/>
    <line x1="328" y1="150" x2="362" y2="90"/><line x1="328" y1="150" x2="362" y2="130"/><line x1="328" y1="150" x2="362" y2="170"/>
  </g>
  <!-- Title -->
  <text x="320" y="230" font-family="sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">機械学習入門</text>
  <text x="320" y="265" font-family="sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Introduction to Machine Learning</text>
  <rect x="220" y="300" width="200" height="4" rx="2" fill="url(#accent)" opacity="0.8"/>
</svg>