    <line x1="0" y1="60" x2="640" y2="60" stroke="#34d399" stroke-width="1"/>
    <line x1="0" y1="120" x2="640" y2="120" stroke="#34d399" stroke-width="1"/>
    <line x1="0" y1="180" x2="640" y2="180" stroke="#34d399" stroke-width="1"/>
    <line x1="0" y1="240" x2="640" y2="240" stroke="#34d399" stroke-width="1"/>
    <line x1="0" y1="300" x2="640" y2="300" stroke="#34d399" stroke-width="1"/>
  </g>
  <!-- ChatGPT-like logo -->
  <circle cx="320" cy="115" r="45" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.7"/>
  <path d="M300,100 Q320,80 340,100" fill="none" stroke="#34d399" stroke-width="2" opacity="0.8"/>
  <path d="M300,115 Q320,130 340,115" fill="none" stroke="#34d399" stroke-width="2" opacity="0.8"/>
